<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ainet 课程选择</title>
  <link rel="stylesheet" href="static/app.css" />
  <link rel="stylesheet" href="static/ui.css" />
  <script src="static/ui.js"></script>
</head>
<!-- 当前布局见 docs/design/ui-upgrade.md：环境横排 → 章节标签 → 课题列表 / 预览。
     保留 spec §16.3 中的选题、环境准备和进入规则。
     点环境只是浏览（GET api/scenarios?env=），不触发切换；点「自由实验 / 开始练习 / 单题考试」才按题目准备环境
     （eNSP Pro：POST api/lab/prepare 轮询进度；eNSP 经典版：提示在 eNSP 中打开拓扑，就绪后才放行），再进操作页。 -->
<body class="course-page" data-ui-page="courses">
  <header id="bar" class="topbar">
    <a class="logo" href="courses" title="课程选择">ainet</a>
    <span class="page-title">课程中心</span>
    <span class="spacer"></span>
    <button id="c-recheck" class="tb-btn sm-h" title="重新探测各模拟环境是否在线">重新检测环境</button>
    <div class="user-wrap">
      <button id="user-btn" class="user-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu"><span id="who">…</span> <span class="caret">▾</span></button>
      <div id="user-menu" class="menu" role="menu" aria-label="学员菜单" hidden>
        <a role="menuitem" href="profile">我的档案</a>
        <button role="menuitem" id="um-ai" type="button">AI 设置</button>
        <a role="menuitem" id="um-switch" href="login">切换学员</a>
        <button role="menuitem" id="logout" class="danger-item">登出</button>
      </div>
    </div>
  </header>
  <div id="c-active" class="c-active" hidden>
    <span id="c-active-text"></span>
    <button id="c-active-go" class="primary">回到操作页</button>
  </div>

  <main id="c-main" class="c-main">
    <section class="course-intro"><div class="ui-eyebrow">网络实操训练</div><h1>选择课题，开始排障</h1><p>按章节选择课题，在实验中修复故障，并回看你的排障过程。</p></section>
    <nav id="environment-settings" class="c-col c-envs" aria-label="模拟环境">
      <div class="c-head c-head-row"><span>模拟环境</span><button id="c-env-add" type="button" class="c-env-add" title="添加环境（如另一台 eNSP Pro）" aria-label="添加模拟环境" hidden></button></div>
      <div id="c-envs" class="c-list"><div class="muted c-pad">检测中…</div></div>
      <div class="c-foot">选择环境浏览课程；接入设置可修改地址，进入课题时才准备设备。</div>
    </nav>
    <nav class="c-col c-chapters" aria-label="章节">
      <div id="c-chap-head" class="c-head">学习章节</div>
      <div id="c-chapters" class="c-list"></div>
    </nav>
    <section class="c-col c-topics" aria-label="课题">
      <div id="c-topic-head" class="c-head">课题</div>
      <div id="c-topics" class="c-list cards"></div>
      <div id="c-topic-foot" class="c-foot"></div>
    </section>
    <section class="c-col c-preview" aria-label="预览">
      <div id="c-preview" class="c-preview-body"><div class="muted">选择左侧的课题查看详情</div></div>
      <div id="c-actions" class="c-actions" hidden>
        <div id="c-prep" class="c-prep"></div>
        <fieldset id="c-entry-modes" class="c-entry-modes"><legend>进入方式</legend>
          <label data-icon="book"><input type="radio" name="entry-mode" value="practice" checked />练习</label>
          <label data-icon="terminal"><input type="radio" name="entry-mode" value="lab" />自由实验</label>
          <label data-icon="shield"><input type="radio" name="entry-mode" value="exam" />考试</label>
        </fieldset>
        <p id="c-entry-note" class="c-entry-note"></p>
        <div class="c-btns">
          <button id="c-lab" class="c-btn" title="不注入故障，在本题的拓扑上自由操作">准备环境并进入实验</button>
          <button id="c-practice" class="c-btn primary">准备环境并开始练习</button>
          <button id="c-exam" class="c-btn" title="本题的考试：计时 15 分钟、无 Agent、无提示，交卷后出成绩单">准备环境并开始考试</button>
          <button id="c-exam-tpl" class="c-btn primary" hidden>开始考试</button>
        </div>
      </div>
    </section>
  </main>

  <!-- 准备环境浮层（spec §16.3「进入」）：遮罩 + 居中卡片；步骤条、整体进度条（已用 / 预计还需）、设备卡片、
       自动重启警示、轮播提示、本题工单；出错时显示后端原因与「重试 / 返回课程」，就绪后短暂停留再进操作页。 -->
  <div id="c-prep-ov" class="pv-ov" hidden>
    <div id="c-progress" class="pv-card" role="dialog" aria-modal="true" aria-labelledby="c-prog-title"
         aria-describedby="pv-sub" tabindex="-1">
      <div class="pv-head">
        <span id="pv-icon" class="pv-icon" aria-hidden="true"></span>
        <div class="pv-ht">
          <h2 id="c-prog-title">正在准备练习环境</h2>
          <div id="pv-sub" class="pv-sub"></div>
        </div>
      </div>
      <ol id="pv-steps" class="pv-steps" aria-label="准备步骤"></ol>
      <div class="pv-prog">
        <div id="pv-bar" class="pv-bar" role="progressbar" aria-label="准备进度" aria-valuemin="0" aria-valuemax="100"
             aria-valuenow="0"><div id="pv-fill" class="pv-fill"></div></div>
        <div class="pv-meta"><b id="pv-pct">0%</b><span id="c-prog-elapsed"></span><span id="pv-eta"></span></div>
      </div>
      <div id="c-prog-stage" class="pv-stage"></div>
      <div id="pv-alert" class="pv-alert" hidden></div>
      <div id="c-prog-devs" class="pv-devs" aria-label="本题设备"></div>
      <div id="c-prog-msg" class="c-prog-msg"></div>
      <div id="pv-tip" class="pv-tip"><span class="pv-tip-k">提示</span><span id="pv-tip-t" class="pv-tip-t"></span></div>
      <details id="pv-ticket" class="pv-ticket" open>
        <summary>本题工单（等待时可以先读）</summary>
        <div id="pv-ticket-body" class="pv-ticket-body"></div>
      </details>
      <div class="pv-btns">
        <button id="c-cancel" class="c-btn">取消</button>
        <button id="pv-back" class="c-btn" hidden>返回课程</button>
        <button id="pv-retry" class="c-btn primary" hidden>重试</button>
      </div>
      <div id="pv-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>
  </div>

  <script src="static/labswitch.js"></script>
  <script src="static/aiset.js"></script>
  <script src="static/courses.js"></script>
</body>
</html>
